<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation | Thiệp Cưới Online</title>

  <!-- QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f2ee;
      margin: 0;
      padding: 0;
    }
    .card {
      max-width: 720px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #b76e79; }
    h2 { font-weight: normal; margin: 6px 0; }
    .lang-switch { margin-bottom: 15px; }
    button.lang {
      margin: 0 5px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .info { line-height: 1.8; margin: 20px 0; }
    .divider { margin: 25px 0; height: 1px; background: #e0e0e0; }
    img.photo { width: 100%; border-radius: 12px; margin: 15px 0; }
    iframe { width: 100%; height: 300px; border-radius: 12px; border: 0; }
    form { text-align: left; margin-top: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    input, select, button.submit {
      width: 100%; padding: 10px; margin-bottom: 14px;
      border-radius: 6px; border: 1px solid #ccc;
    }
    button.submit { background: #b76e79; color: #fff; font-size: 16px; cursor: pointer; }
    .note { font-size: 13px; color: #666; text-align: center; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    #play-button { margin-top: 12px; }
  </style>
</head>
<body>

<audio id="bg-music" src="https://raw.githubusercontent.com/canhthanh131094-cpu/thiep-cuoi-harry/a668bd949f6e23745f19d0fb95131fed6b5903d2/nhaccuoi.mp3" loop playsinline></audio>

<div class="card">
  <div class="lang-switch">
    <button class="lang" onclick="setLang('vi')">🇻🇳 Việt</button>
    <button class="lang" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang" onclick="setLang('zh')">🇨🇳 中文</button>
  </div>

  <h1 id="title">Thiệp Mời Lễ Cưới</h1>
  <h2>💍 Cảnh Thành & 💐 Đặng Loan</h2>

  <img class="photo" src="https://raw.githubusercontent.com/canhthanh131094-cpu/thiep-cuoi-harry/a668bd949f6e23745f19d0fb95131fed6b5903d2/anhcuoi.png" alt="Wedding Photo" />

  <div class="info" id="info">
    <p>Trân trọng kính mời bạn đến tham dự lễ cưới của chúng tôi</p>
    <p><strong>⏰ Thời gian:</strong> 10:30 – Thứ 7, 07/02/2026</p>
    <p><strong>📍 Địa điểm:</strong>xóm 2, xã Yên Thành, Nghệ An</p>
  </div>

  <iframe src="https://www.google.com/maps?q=xóm+2,+Yên+Thành,+Nghệ+An&output=embed"></iframe>

  <div class="divider"></div>

  <h3 id="confirm">Xác nhận tham dự</h3>

  <!-- GOOGLE SHEET FORM -->
  <form id="rsvp-form" action="https://docs.google.com/forms/d/e/1FAIpQLSes1GuX-Zzefo0YcbXN3iocZzHySsr63n_SBYuozVbK3qPBHQ/formResponse" method="POST" target="hidden_iframe">
    <label>Họ tên / Name</label>
    <input name="entry.1095284742" required />

    <label>Số điện thoại / Phone</label>
    <input name="entry.805429574" required />

    <label>Tham dự / Attendance</label>
    <select name="entry.1675628208">
      <option value="Yes">Tham dự / Yes</option>
      <option value="No">Không tham dự / No</option>
    </select>

    <button type="submit" class="submit">Gửi xác nhận</button>
  </form>
  <iframe name="hidden_iframe" style="display:none"></iframe>

  <div id="qrcode"></div>

  <p class="note">Quét QR để mở thiệp 💖</p>

  <button id="play-button" style="display:none; padding:10px 16px; border-radius:6px; background:#b76e79; color:#fff; border:0; cursor:pointer;">Bật nhạc</button>
</div>

<script>
  const text = {
    vi: {
      title: 'Thiệp Mời Lễ Cưới',
      info: 'Trân trọng kính mời bạn đến tham dự lễ cưới của chúng tôi',
      confirm: 'Xác nhận tham dự'
    },
    en: {
      title: 'Wedding Invitation',
      info: 'You are warmly invited to our wedding ceremony',
      confirm: 'RSVP'
    },
    zh: {
      title: '婚礼邀请函',
      info: '诚挚邀请您参加我们的婚礼',
      confirm: '出席确认'
    }
  };

  function setLang(lang) {
    document.getElementById('title').innerText = text[lang].title;
    document.getElementById('info').children[0].innerText = text[lang].info;
    document.getElementById('confirm').innerText = text[lang].confirm;
  }

  // QR Code
  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href,
    width: 128,
    height: 128
  });

  // Background music autoplay handling
  const audio = document.getElementById('bg-music');
  const playBtn = document.getElementById('play-button');

  window.addEventListener('load', async () => {
    try {
      await audio.play();
      // autoplay succeeded, hide button
      playBtn.style.display = 'none';
    } catch (err) {
      // autoplay blocked -> show button so user can start audio
      playBtn.style.display = 'inline-block';
    }
  });

  playBtn.addEventListener('click', () => {
    audio.play();
    playBtn.style.display = 'none';
  });

  // Submit handling: show a small confirmation when iframe loads after submit
  const form = document.getElementById('rsvp-form');
  const iframe = document.querySelector('iframe[name="hidden_iframe"]');

  iframe.addEventListener('load', function() {
    // The iframe will load after form submit; we can show a thank-you message.
    // Note: Google Forms does not return JSON; this is a simple heuristic.
    if (form.dataset.submitted === 'true') {
      alert('Cảm ơn! Xác nhận đã gửi.');
      form.dataset.submitted = 'false';
      form.reset();
    }
  });

  form.addEventListener('submit', () => {
    // mark that we submitted so iframe load handler can show message
    form.dataset.submitted = 'true';
  });
</script>

</body>
</html>
