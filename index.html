<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation | Thiệp Cưới Online</title>

  <!-- QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f2ee;
      margin: 0;
      padding: 0;
    }
    .card {
      max-width: 720px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #b76e79; }
    h2 { font-weight: normal; margin: 6px 0; }
    .lang-switch { margin-bottom: 15px; }
    button.lang {
      margin: 0 5px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .info { line-height: 1.8; margin: 20px 0; }
    .divider { margin: 25px 0; height: 1px; background: #e0e0e0; }
    img.photo { width: 100%; border-radius: 12px; margin: 15px 0; }
    iframe { width: 100%; height: 300px; border-radius: 12px; border: 0; }
    form { text-align: left; margin-top: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; }
    input, select, button.submit {
      width: 100%; padding: 10px; margin-bottom: 14px;
      border-radius: 6px; border: 1px solid #ccc;
    }
    button.submit {
      background: #b76e79;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    #musicBtn {
      margin-bottom: 15px;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: #b76e79;
      color: #fff;
      cursor: pointer;
    }
    .note { font-size: 13px; color: #666; text-align: center; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgm" loop>
  <source src="nhaccuoi.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn">🎵 Bật nhạc</button>

<div class="card">
  <div class="lang-switch">
    <button class="lang" onclick="setLang('vi')">🇻🇳 Việt</button>
    <button class="lang" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang" onclick="setLang('zh')">🇨🇳 中文</button>
  </div>

  <h1 id="title"></h1>
  <h2>💍 Cảnh Thành & 💐 Đặng Loan</h2>

  <img class="photo" src="anhcuoi.png" alt="Wedding Photo" />

  <div class="info">
    <p id="inviteText"></p>
    <p id="timeText"></p>
    <p id="locationText"></p>
  </div>

  <!-- GOOGLE MAP -->
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d916.1961618975104!2d105.44576393415441!3d19.012184735595962"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div class="divider"></div>

  <h3 id="confirm"></h3>

  <!-- GOOGLE FORM -->
  <form
    action="https://docs.google.com/forms/d/e/1FAIpQLSes1GuX-Zzefo0YcbXN3iocZzHySsr63n_SBYuozVbK3qPBHQ/formResponse"
    method="POST"
    target="hidden_iframe">

    <label>Họ tên / Name</label>
    <input name="entry.1095284742" required>

    <label>Số điện thoại / Phone</label>
    <input name="entry.805429574" required>

    <label>Tham dự / Attendance</label>
    <select name="entry.1675628208" required>
      <option value="Yes">Tham dự / Yes</option>
      <option value="No">Không tham dự / No</option>
    </select>

    <button type="submit" class="submit">Gửi xác nhận</button>
  </form>

  <iframe name="hidden_iframe" style="display:none"></iframe>

  <div id="qrcode"></div>
  <p class="note">Quét QR để mở thiệp 💖</p>
</div>

<script>
/* 🌐 LANGUAGE */
const text = {
  vi: {
    title: "Thiệp Mời Lễ Cưới",
    invite: "Trân trọng kính mời bạn đến tham dự lễ cưới của chúng tôi",
    time: "⏰ Thời gian: 10:30 – Thứ 7, 07/02/2026",
    location: "📍 Địa điểm: Xóm 2, xã Yên Thành, Nghệ An",
    confirm: "Xác nhận tham dự"
  },
  en: {
    title: "Wedding Invitation",
    invite: "You are warmly invited to our wedding ceremony",
    time: "⏰ Time: 10:30 AM – Saturday, Feb 7, 2026",
    location: "📍 Location: Hamlet 2, Yen Thanh Commune, Nghe An, Vietnam",
    confirm: "RSVP"
  },
  zh: {
    title: "婚礼邀请函",
    invite: "诚挚邀请您参加我们的婚礼",
    time: "⏰ 时间：2026年2月7日（星期六）10:30",
    location: "📍 地点：越南义安省延城县延成社二村",
    confirm: "出席确认"
  }
};

function setLang(lang) {
  document.getElementById("title").innerText = text[lang].title;
  document.getElementById("inviteText").innerText = text[lang].invite;
  document.getElementById("timeText").innerText = text[lang].time;
  document.getElementById("locationText").innerText = text[lang].location;
  document.getElementById("confirm").innerText = text[lang].confirm;
}

setLang("vi");

/* 🎵 MUSIC */
document.getElementById("musicBtn").addEventListener("click", () => {
  const bgm = document.getElementById("bgm");
  bgm.play().then(() => {
    document.getElementById("musicBtn").innerText = "🔊 Đang phát nhạc";
  });
});

/* 📱 QR CODE */
new QRCode(document.getElementById("qrcode"), {
  text: window.location.href,
  width: 128,
  height: 128
});
</script>

</body>
</html>
